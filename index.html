<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ee;
    --pink:#ee5586;
    --pink-deep:#d63d78;
    --ink:#2b2620;
    --muted:#8a8175;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ overflow-x:hidden; scroll-behavior:smooth; }
  body{
    background:var(--bg);
    font-family:'Poppins', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
  }

  .content{
    max-width:420px;
    margin:0 auto;
    padding:50px 24px 0;
    position:relative;
    z-index:2;
    overflow:visible;
  }

  section{
    position:relative;
  }

  /* ---------- scroll-reveal transitions ---------- */
  .reveal{
    opacity:0;
    transform:translateY(28px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .reveal.in-view{
    opacity:1;
    transform:translateY(0);
  }

  /* ---------- floating decorations (very slow) ---------- */
  .decor{
    position:absolute;
    pointer-events:none;
    z-index:1;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,0.10));
  }
  .decor.clickable{ pointer-events:auto; cursor:pointer; }
  @keyframes float-a{ 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); } 50%{ transform:translateY(-16px) rotate(var(--r,0deg)); } }
  @keyframes float-b{ 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); } 50%{ transform:translateY(18px) rotate(var(--r,0deg)); } }
  .float-a{ animation:float-a 11s ease-in-out infinite; }
  .float-b{ animation:float-b 13s ease-in-out infinite; }

  /* ---------- decor images ---------- */
  .decor img, img.decor{
    display:block;
    width:100%;
    height:auto;
  }

  /* ---------- HERO ---------- */
  .hero{
    text-align:center;
    padding:200px 0 6px;
    overflow:visible;
  }
  .title-img{
    display:block;
    width:100%;
    max-width:360px;
    margin:14px auto 0;
    height:auto;
  }

  /* ---------- AGE BALLOONS (full-bleed band under the title) ---------- */
  .age-band{
    position:relative;
    left:50%;
    right:50%;
    margin-left:-50vw;
    margin-right:-50vw;
    width:100vw;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:2vw;
    padding:6px 0 26px;
    overflow:visible;
  }
  .age-balloon{
    width:33vw;
    max-width:170px;
    height:auto;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.14));
  }

  /* ---------- DETAILS (floating, no card) ---------- */
  .details{
    padding:14px 0 34px;
    text-align:center;
  }
  .detail-line{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    padding:11px 0;
    font-size:18px;
  }
  .detail-line .sub{
    display:block;
    font-family:'Caveat', cursive;
    font-size:17px;
    font-weight:600;
    color:var(--muted);
    margin-top:2px;
  }

  /* ---------- MAP (kept minimal, functional) ---------- */
  .map-wrap{
    padding:10px 0 40px;
  }
  .map-wrap iframe{
    width:100%;
    height:210px;
    border:0;
    display:block;
    border-radius:14px;
    filter:grayscale(0.1) contrast(1.02);
  }
  .map-caption{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
    font-size:14px;
    color:var(--muted);
  }

  /* ---------- BUTTONS (ghost pills, no big colored boxes) ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:10px 16px;
    border-radius:999px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:13px;
    text-decoration:none;
    border:1.5px solid var(--ink);
    cursor:pointer;
    background:transparent;
    color:var(--ink);
    transition:transform .15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn.pink{
    border-color:var(--pink-deep);
    color:var(--pink-deep);
  }
  .btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }

  /* ---------- RSVP (floating text, no box) — final content block ---------- */
  .rsvp{
    text-align:center;
    padding:26px 0 90px;
  }
  .rsvp p{
    font-family:'Caveat', cursive;
    font-size:27px;
    font-weight:700;
    margin:0;
    color:var(--ink);
    line-height:1.3;
    transform:rotate(-0.6deg);
  }
  .rsvp .btn-row{
    margin-top:24px;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="content">

  <!-- ================= HERO ================= -->
  <section class="hero reveal">
    <img class="decor float-b" src="images/estrella-grunge.png" alt="" style="top:6px;right:-2%;width:clamp(50px,18vw,80px);">

    <!-- silver disco ball, top-left, clickable for confetti -->
    <div class="decor clickable float-a" style="top:-4px; left:-8%; width:clamp(90px,32vw,140px);" onclick="burstConfetti()" title="Toca la bola disco">
      <img src="images/disco-plata.png" alt="">
    </div>

    <!-- silver bunting, centered at the top of the header -->
    <div class="decor" style="top:-16px; left:50%; transform:translateX(-50%); width:clamp(240px,78vw,360px);">
      <img class="float-a" src="images/banderines.png" alt="">
    </div>

    <img class="title-img" src="images/titulo.png" alt="Te invito a celebrar mi cumpleaños">
  </section>

  <!-- ============ globos de edad, a todo el ancho, justo debajo del título ============ -->
  <div class="age-band reveal">
    <img class="age-balloon float-a" src="images/globo-4.png" alt="4">
    <img class="age-balloon float-b" src="images/globo-6.png" alt="6">
  </div>

  <!-- ================= DETALLES ================= -->
  <section class="details reveal">
    <!-- martini glass, left edge -->
    <img class="decor float-b" src="images/copa.png" alt="" style="top:24px; left:-22%; width:clamp(80px,28vw,130px);">
    <!-- lips, right edge -->
    <img class="decor float-a" src="images/labios.png" alt="" style="top:60px; right:-18%; width:clamp(60px,22vw,100px);">

    <div class="detail-line">Miércoles 16 de septiembre</div>
    <div class="detail-line">8:00 PM</div>
    <div class="detail-line">Yiva's Bar Restaurante, Nandayure</div>
    <span class="sub">Te espero para celebrar juntos<br>y compartir una linda velada</span>

    <!-- cupcake, right edge -->
    <img class="decor float-a" src="images/cupcake.png" alt="" style="bottom:-20px; right:-20%; width:clamp(70px,26vw,120px);">
  </section>

  <!-- ================= MAPA ================= -->
  <section class="map-wrap reveal">
    <iframe
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      src="https://www.google.com/maps?q=Yiva%27s+Bar+Restaurante%2C+Nandayure%2C+Guanacaste%2C+Costa+Rica&output=embed">
    </iframe>
    <div class="map-caption">
      <span>Yiva's Bar Restaurante</span>
      <a class="btn pink" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=Yiva%27s+Bar+Restaurante%2C+Nandayure%2C+Guanacaste%2C+Costa+Rica">
        Cómo llegar
      </a>
    </div>
  </section>

  <!-- ================= RSVP (informal, sin caja) — bloque final, con el botón de calendario debajo ================= -->
  <section class="rsvp reveal">
    <!-- vinyl record, left edge -->
    <img class="decor float-b" src="images/vinilo.png" alt="" style="top:-30px; left:-22%; width:clamp(80px,28vw,130px);">

    <!-- balloons, right edge -->
    <img class="decor float-a" src="images/globos.png" alt="" style="top:-50px; right:-16%; width:clamp(70px,26vw,110px);">

    <!-- cat face, left edge -->
    <img class="decor float-b" src="images/gato.png" alt="" style="bottom:-10px; left:-20%; width:clamp(80px,28vw,130px);">

    <!-- pink disco ball, end of the page, to one side -->
    <div class="decor clickable float-a" style="bottom:-20px; right:-14%; width:clamp(80px,28vw,120px);" onclick="burstConfetti()" title="Toca la bola disco">
      <img src="images/disco-rosa.png" alt="">
    </div>

    <p>Aparta la fecha,<br>¡nos vemos!</p>

    <div class="btn-row">
      <a class="btn" target="_blank" rel="noopener" id="googleCalBtn" href="#">Google Calendar</a>
    </div>
  </section>
</div>

<script>
  // ---------- Fechas del evento (hora de Costa Rica, UTC-6) ----------
  const evtStartUTC = "20260917T020000Z"; // 16 sep 8:00 PM CR
  const evtEndUTC   = "20260917T050000Z"; // 16 sep 11:00 PM CR
  const title = "Mi Cumpleaños (46 años)";
  const venue = "Yiva's Bar Restaurante, Nandayure, Guanacaste, Costa Rica";
  const details = "¡Celebremos! Miércoles 16 de septiembre, 8:00 PM en Yiva's Bar Restaurante, Nandayure.";

  // Google Calendar link
  const gcalUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(title)
    + "&dates=" + evtStartUTC + "/" + evtEndUTC
    + "&details=" + encodeURIComponent(details)
    + "&location=" + encodeURIComponent(venue);
  document.getElementById('googleCalBtn').href = gcalUrl;

  // ---------- Confetti interactivo ----------
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  let particles = [];
  const colors = ['#ee5586', '#ffffff', '#d63d78', '#c7cbd1', '#2b2620'];

  function burstConfetti(){
    const cx = window.innerWidth/2;
    for(let i=0;i<60;i++){
      particles.push({
        x: cx,
        y: 120,
        vx: (Math.random()-0.5)*10,
        vy: Math.random()*-8 - 2,
        size: Math.random()*6+4,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*10,
        life: 0
      });
    }
  }

  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.vy += 0.28;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    particles = particles.filter(p => p.y < window.innerHeight+40 && p.life < 400);
    requestAnimationFrame(loop);
  }
  loop();

  // ---------- Transición al deslizar: aparecen las secciones al hacer scroll ----------
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  revealEls.forEach(el => io.observe(el));
</script>
</body>
</html>
